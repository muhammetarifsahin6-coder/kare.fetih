
name: KareFetih Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Kaynak kodunu indir
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v3

      - name: Bağımlılıkları yükle
        run: npm install --legacy-peer-deps

      - name: Web uygulamasını derle
        run: npm run build

      - name: Android projesini oluştur
        run: npx cap add android

      - name: Android dosyalarını eşitle
        run: npx cap sync android

      - name: APK oluştur
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: APK dosyasını kaydet
        uses: actions/upload-artifact@v4
        with:
          name: KareFetih-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
